version: '3.8'

services:
  iot-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iot-sensor-stack
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Asia/Bangkok
      - DB_PATH=/app/data/sensor_data.db
      - API_PORT=5000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
